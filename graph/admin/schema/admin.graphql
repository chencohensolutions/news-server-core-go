# Admin API, served only on the loopback admin listener (admin_addr) and used by the
# `news-server enroll-code | devices | revoke` commands. See docs/authentication.md.

scalar Time

type Query {
  "Enrolled devices, oldest first; all users when user is omitted."
  devices(user: String): [Device!]!
}

type Mutation {
  """
  Creates a one-time enrollment code for user. A new name makes the user, with role (user when omitted); a user that
  exists keeps their role unless role is given.
  """
  createEnrollmentCode(user: String!, role: String): EnrollmentCode!
  "Revokes an enrolled device's certificate; the server rejects it from then on."
  revokeDevice(serial: String!): Device!
}

type EnrollmentCode {
  code: String!
  user: String!
  "admin or user."
  role: String!
  expiresAt: Time!
  "public_url from config.json, else the router's outside address when the server maps its port; null without either."
  serverUrl: String
  "The server certificate key's sha256, 64 hex digits: the app pins it."
  fingerprint: String
  "The server's ed25519 key in the DHT, 64 hex digits; null when discovery is off."
  dhtKey: String
  "Where the running server can be reached now, the most likely first: the app tries them and keeps them."
  addresses: [String!]!
}

type Device {
  serial: String!
  user: String!
  name: String!
  keyProtection: String!
  registeredAt: Time!
  expiresAt: Time!
  revokedAt: Time
}
