# --- Authentication -----------------------------------------------------------
# Every root field requires a client certificate unless it is marked @public.
# See docs/authentication.md.
#
# Errors a device acts on carry a code in extensions.code: UNAUTHORIZED, BAD_REQUEST (more than a field allows).

scalar Time

"Root field that clients may call without a client certificate."
directive @public on FIELD_DEFINITION

type Query {
  "Which account an enrollment code belongs to. Does not use up the code."
  enrollmentPreview(code: String!): EnrollmentPreviewResult! @public
  "What this server can do, so the app shows only what works."
  serverInfo: ServerInfo!
}

type ServerInfo {
  "The API's version: raised when a change needs newer apps."
  api: Int!
  "A device can renew its certificate (renewCertificate) before it expires."
  renewCertificates: Boolean!
  "The server's version and build."
  version: String!
  "The server groups stories (its story model is installed and story_strictness isn't -1)."
  stories: Boolean!
}

type Mutation {
  "Trades a one-time enrollment code and a certificate request for a client certificate."
  enrollDevice(input: EnrollDeviceInput!): EnrollDeviceResult! @public
  """
  Renews the calling device's certificate (serverInfo.renewCertificates): a new certificate for a new key, for the same
  user and device, with its settings. The old certificate works until the new one is first used, and is then
  revoked. A device renews in the last 30 days of its certificate (expiresAt). NOT_ENROLLED for a certificate made
  outside enrollment, or revoked.
  """
  renewCertificate(csr: String!, keyProtection: KeyProtection!): EnrollDeviceResult!
}

input EnrollDeviceInput {
  "As shown by `news-server enroll-code`; case, dashes and spaces are ignored."
  code: String!
  "Shown in `news-server devices` so the device can be told apart and revoked."
  deviceName: String!
  "PKCS#10 certificate request for an EC P-256 key, base64-encoded DER."
  csr: String!
  keyProtection: KeyProtection!
}

"Where the device keeps its private key."
enum KeyProtection {
  "Android StrongBox security chip"
  STRONGBOX
  "Android Keystore in the trusted execution environment"
  TEE
  "Apple Secure Enclave"
  SECURE_ENCLAVE
  "Ordinary software key (emulators and simulators)"
  SOFTWARE
}

union EnrollmentPreviewResult = EnrollmentPreview | EnrollmentRejected

type EnrollmentPreview {
  user: String!
  expiresAt: Time!
}

union EnrollDeviceResult = EnrolledDevice | EnrollmentRejected

type EnrolledDevice {
  user: String!
  deviceName: String!
  "Issued client certificate, base64-encoded DER."
  certificate: String!
  serial: String!
  expiresAt: Time!
}

type EnrollmentRejected {
  reason: EnrollmentRejectedReason!
}

enum EnrollmentRejectedReason {
  "Wrong, expired or already used code."
  INVALID_CODE
  "The certificate request is malformed, badly signed or not for an EC P-256 key."
  INVALID_CSR
  "Too many wrong codes from this address; wait a minute."
  RATE_LIMITED
  "renewCertificate: the certificate wasn't issued by enrollment, or is revoked; enroll again."
  NOT_ENROLLED
}
