# Public API (phones, over mTLS). Generate with: go tool gqlgen generate
schema:
  - graph/schema/*.graphql

exec:
  filename: graph/generated/generated.go

model:
  filename: graph/model/models_gen.go

resolver:
  layout: follow-schema
  dir: graph/resolver

models:
  Source:
    model: github.com/chencohensolutions/news-server-core-go/sites.Source
