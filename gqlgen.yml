# Public API (phones, over mTLS). Generate with: go tool gqlgen generate
schema:
  - graph/schema/*.graphql

exec:
  filename: graph/generated/generated.go

model:
  filename: graph/model/models_gen.go

resolver:
  layout: follow-schema
  dir: graph/resolver

models:
  Source:
    model: github.com/chencohensolutions/news-server-core-go/sites.Source
    fields:
      hidden:
        resolver: true
  Headline:
    model: github.com/chencohensolutions/news-server-core-go/graph/model.Headline
  Article:
    model: github.com/chencohensolutions/news-server-core-go/graph/model.Article
  ArticleBlock:
    model: github.com/chencohensolutions/news-server-core-go/graph/model.ArticleBlock
  ArticleVideo:
    model: github.com/chencohensolutions/news-server-core-go/graph/model.ArticleVideo
  StoryList:
    model: github.com/chencohensolutions/news-server-core-go/graph/model.StoryList
  Story:
    model: github.com/chencohensolutions/news-server-core-go/graph/model.Story
  StorySummary:
    fields:
      threads:
        resolver: true
  Thread:
    fields:
      stories:
        resolver: true
      related:
        resolver: true
